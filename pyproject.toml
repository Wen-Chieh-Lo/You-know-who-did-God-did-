[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-new-channel-recs"
version = "0.1.0"
description = "Leakage-safe new-channel recommendation experiments on Twitch 100k"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
  "numba>=0.60,<1",
  "tqdm>=4.66,<5",
  "tabulate>=0.9,<1",
  "duckdb>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jupyter>=1,<2", "nbformat>=5,<6"]
advanced = ["torch>=2.2,<3"]
presentation = ["python-pptx>=1,<2", "Pillow>=10,<13"]

[project.scripts]
twitch-recs = "twitch_recs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

